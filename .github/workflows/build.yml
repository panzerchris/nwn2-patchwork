name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Offline tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nwn2-patchwork-windows-x86
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download $env:RUN_ID --name nwn2-patchwork-windows-x86 --dir dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --prerelease --title "NWN2 Patchwork $env:RELEASE_TAG" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
