; NWN2 Patchwork — display fixes for the two supported GOG 1.23 builds.
; Use 1 to enable and 0 to disable. See docs/configuration.md for dependencies.
[Display]
RevertV2=1
GuardEmptyRestore=1
NativeSizing=1
SyncWindowedMode=1
PreservePlacement=1
ThrottleLostDevice=1
FixMinimapHeight=1
FixGraphicsControls=1
FitWindowedApply=1

; Optional EPOS Connect workaround. Start windowed, then use Alt+Enter.
; 0 keeps native exclusive fullscreen; 1 uses desktop-sized borderless instead.
BorderlessAltEnter=0

; Minimum resize dimensions. Both zero removes this minimum.
MinClientWidth=800
MinClientHeight=600
